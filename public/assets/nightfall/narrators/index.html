<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nightfall · 中文旁白试听</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#100e17;color:#f6eef4;font:16px/1.65 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:32px 20px 64px}a{color:#efb5b8}h1{font-size:clamp(28px,5vw,44px);line-height:1.2;margin-bottom:14px}p{color:#c6b8ca}label{display:grid;gap:6px;min-width:0}select{min-width:0;font:inherit;min-height:48px;background:#241d2b;color:inherit;border:1px solid #655267;border-radius:10px;padding:10px;width:100%}.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px;margin:28px 0}#script{padding:18px;background:#241d2b;border-left:3px solid #e4a4ab;border-radius:8px}#voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}article{border:1px solid #493c50;border-radius:14px;padding:20px;background:#191520}h2{font-size:21px;margin:0 0 4px}small{display:block;color:#b9a9bf;margin-bottom:16px}audio{width:100%}.hint{font-size:14px}@media(max-width:560px){.filters{grid-template-columns:1fr}}</style>
<main><a href="/nightfall/">← Nightfall / 天黑请闭眼</a><h1>选一位，陪你入夜。</h1><p>Chinese narrator listening room · 六位新旁白，以及保留的 Brian 与 Kokoro。</p><div class="filters"><label>游戏 / Game<select id="game"><option value="werewolf">狼人杀 · Werewolf</option><option value="one-night">一夜狼人杀 · One Night</option></select></label><label>播报 / Announcement<select id="cue"></select></label></div><p id="script" aria-live="polite">正在加载录音列表…</p><div id="voices"></div><p class="hint">游戏中可随时在语音设置切换中文旁白，下一段录音开始使用新声音。英文旁白不变。Brian 保留原有狼人杀录音，后续新增播报仍使用 Kokoro。</p></main>
<script type="module">
const catalogue=await fetch('./catalogue.json').then(r=>r.json());
const originals=await Promise.all(['werewolf','one-night','nightfall'].map(g=>fetch('/assets/'+g+'/audio/manifest.json').then(r=>r.json())));
const game=document.querySelector('#game'),cue=document.querySelector('#cue'),list=document.querySelector('#voices');
function show(){const id=catalogue.games[game.value][cue.value];document.querySelector('#script').textContent=catalogue.lines[id];list.querySelectorAll('audio').forEach(audio=>audio.pause());list.replaceChildren();
const choices=[...(game.value==='werewolf'?[{id:'brian',name:{zh:'Brian · 经典旁白',en:'Original Brian & Kokoro'}}]:[]),{id:'kokoro',name:{zh:'Kokoro · 沉稳男声',en:'Kokoro · Steady Voice'}},...catalogue.narrators];
for(const voice of choices){const card=document.createElement('article'),title=document.createElement('h2'),label=document.createElement('small'),audio=document.createElement('audio');title.textContent=voice.name.zh;label.textContent=voice.name.en;audio.controls=true;audio.preload='none';audio.setAttribute('aria-label',voice.name.zh+'试听');audio.src=voice.id==='brian'?(originals[2].clips['zh:'+cue.value]||originals[0].clips['zh:'+cue.value]).src:voice.id==='kokoro'&&catalogue.kokoro[id]?catalogue.kokoro[id]:'/assets/nightfall/narrators/'+voice.id+'/'+id+'.mp3';audio.addEventListener('play',()=>list.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()}));card.append(title,label,audio);list.append(card)}}
function populate(){cue.replaceChildren();for(const [key,id] of Object.entries(catalogue.games[game.value])){const option=document.createElement('option');option.value=key;option.textContent=catalogue.lines[id];cue.append(option)}cue.value='night';show()}
game.addEventListener('change',populate);cue.addEventListener('change',show);populate();
</script></html>
